name: Test and deploy

# Every push to main is tested, then published to Firebase: the database
# security rules (database.rules.json) first, then the site itself.
# Pull requests are only tested. "Run workflow" on the Actions tab deploys too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish database rules
        if: github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
        # The site still deploys if this fails; the error shows as notes on the run.
        continue-on-error: true
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          log="$RUNNER_TEMP/rules.log"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$key"
          set +e
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx --yes firebase-tools@15 deploy --only database --project "$PROJECT" --non-interactive > "$log" 2>&1
          status=$?
          cat "$log"
          # The upload can succeed even if a later lookup fails; that still counts.
          if [ "$status" -ne 0 ] && grep -q 'settings/rules.json' firebase-debug.log 2>/dev/null \
             && grep -A2 'PUT .*settings/rules.json' firebase-debug.log | grep -q '"status":"ok"'; then
            echo "::notice title=Publish database rules::Rules published (a later lookup failed, which doesn't matter)."
            status=0
          fi
          if [ "$status" -ne 0 ]; then
            # The real reason is usually in the debug log (HTTP status and message).
            { grep -hiE '"(code|status|message)"|HTTP Error|[0-9]{3}, ' firebase-debug.log 2>/dev/null | grep -viE 'token|private|credential' | tail -n 6
              grep -v '^\s*$' "$log" | tail -n 3; } | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Publish database rules::${line}"
            done
            exit "$status"
          fi

      - name: Deploy the site to Firebase Hosting
        if: github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
